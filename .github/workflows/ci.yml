name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p vera-adapters
      - run: cargo test --locked -p vera-adapters --no-default-features --features cbor
      - run: cargo test --locked -p vera-adapters --example python_bridge
      - run: cargo build --locked --release -p vera-adapters --example python_bridge
      - run: PYTHONPATH=python python3 -m unittest discover -s python -v
